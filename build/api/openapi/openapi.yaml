  /v1/admin/blends/{slug}/publish:
    post:
      operationId: adminPublishBlend
      summary: Publish a blend and enqueue revalidation of the affected pages
      description: |
        Moves the blend to published, writes an immutable published snapshot, and enqueues
        regeneration of exactly the affected pages.

        Returns 202 rather than 200: publishing does NOT wait for regeneration. The
        previous version keeps serving until the new one is ready, so no customer waits for
        a render and no editor waits for a deploy. SOW section 6.2 requires content live
        within 5 minutes; this is expected to complete in seconds.

        Returns 422 PUBLISH_BLOCKED when the blend is not publishable, for example a
        missing grower or a hero image still processing. The response lists every blocking
        reason at once rather than one at a time, because an editor fixing five problems in
        five round trips will stop using the tool.
      tags: [Admin Publishing]
      security:
        - bearerAuth: []
      x-tap-path: false
      x-minimum-role: Editor
      parameters:
        - $ref: '#/components/parameters/BlendSlug'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: The version being published. Guards against publishing a stale draft.
                note:
                  type: [string, 'null']
                  maxLength: 500
                  description: Optional change note recorded against the published snapshot.
      responses:
        '202':
          description: Publish accepted, revalidation enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
              examples:
                published:
                  value:
                    slug: persian-sunrise
                    status: published
                    version: 12
                    publishedAt: '2026-08-17T09:12:44Z'
                    revalidationId: rvl_01J9Z95D6E7F8G9H0J1K2M3N4P
                    paths:
                      - /blend.html?blend=persian-sunrise
                      - /blends/persian-sunrise
                      - /sitemap.xml
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: The blend cannot be published yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                blocked:
                  value:
                    error:
                      code: PUBLISH_BLOCKED
                      message: 'This blend cannot be published yet. 2 problems must be fixed.'
                      requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
                      details:
                        - field: growerId
                          issue: required_for_publish
                        - field: heroImageId
                          issue: media_still_processing
        '500':
          $ref: '#/components/responses/InternalError'


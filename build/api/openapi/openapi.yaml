  /v1/admin/analytics/scans:
    get:
      operationId: adminGetScanTimeSeries
      summary: Scan time series, read from pre-aggregated rollups
      description: |
        Access pattern 7 in the Architecture document data layer table: dashboard time
        series. A rollup range query, NEVER a table scan.

        This operation reads pre-aggregated rollup items only. It never reads raw scan
        events and never scans a table. That is the difference between a dashboard that is
        still fast at ten million scans and one that gets slower every month.

        Every response carries measurementMethod. Per SKU tag encoding means there is no
        per-tag counter, so NFC and QR counts are both produced by a browser side token.
        The dashboard states that rather than implying an NFC precision the encoding does
        not provide.
      tags: [Admin Analytics]
      security:
        - bearerAuth: []
      x-tap-path: false
      x-minimum-role: Viewer
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            examples: ['2026-08-01']
        - name: to
          in: query
          required: true
          description: Inclusive. Maximum range is 366 days at day granularity and 31 days at hour granularity.
          schema:
            type: string
            format: date
            examples: ['2026-08-17']
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [hour, day]
            default: day
        - name: blend
          in: query
          required: false
          description: Restrict to one blend. Omit for the all blends rollup.
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: The time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTimeSeries'
              examples:
                threeDays:
                  summary: Persian Sunrise, three days at day granularity
                  value:
                    blend: persian-sunrise
                    granularity: day
                    from: '2026-08-15'
                    to: '2026-08-17'
                    measurementMethod: browser_token
                    measurementNote: >-
                      NFC and QR counts are deduplicated by the same browser side token,
                      because per SKU tag encoding provides no per-tag counter. The two
                      channels are directly comparable to each other and neither is a
                      per-jar count.
                    source: rollup
                    points:
                      - bucket: '2026-08-15'
                        scans: 118
                        byChannel: { nfc: 74, qr: 41, direct: 3 }
                        byPlatform: { ios: 79, android: 36, other: 3 }
                        reorderClicks: 14
                        recipeOpens: 61
                        cache: { hit: 115, miss: 3 }
                        timeToReadable: { count: 118, sumMs: 139240, p50Ms: 1150, p95Ms: 1720 }
                        topCities:
                          - { country: US, region: MA, city: Boston, scans: 44 }
                          - { country: US, region: NY, city: Brooklyn, scans: 21 }
                      - bucket: '2026-08-16'
                        scans: 96
                        byChannel: { nfc: 60, qr: 34, direct: 2 }
                        byPlatform: { ios: 63, android: 31, other: 2 }
                        reorderClicks: 9
                        recipeOpens: 48
                        cache: { hit: 96, miss: 0 }
                        timeToReadable: { count: 96, sumMs: 111360, p50Ms: 1130, p95Ms: 1690 }
                        topCities:
                          - { country: US, region: MA, city: Boston, scans: 33 }
                      - bucket: '2026-08-17'
                        scans: 41
                        byChannel: { nfc: 27, qr: 13, direct: 1 }
                        byPlatform: { ios: 28, android: 12, other: 1 }
                        reorderClicks: 5
                        recipeOpens: 19
                        cache: { hit: 41, miss: 0 }
                        timeToReadable: { count: 41, sumMs: 46740, p50Ms: 1120, p95Ms: 1660 }
                        topCities:
                          - { country: US, region: MA, city: Boston, scans: 16 }
        '400':
          description: Invalid or excessive range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rangeTooLarge:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 'Range exceeds 31 days at hour granularity.'
                      requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
                      details:
                        - field: to
                          issue: range_too_large
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'


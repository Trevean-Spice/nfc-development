      description: |
        READ ONLY. The redirect table is a version controlled artifact deployed with the
        application, never hand edited state in a hosting console. There is no write
        operation here for any role, including Admin. A thousand encoded tags resolve
        through this table, so a change to it is a code review and a deployment, not a
        form submission.

        This operation exists so an operator can verify what is actually deployed without
        cloning the repository, and so a pre cutover and post cutover verification against
        physical tags can be recorded.

        writeProtected is true for the shipped SO4731 run. Reversed on Friday 11 September
        2026 (decision log D45, reversing D18 and re-answering Q4): the shipped tags are
        write protected with an ST25TV area password nobody at Trevean holds, so the 1,000
        tags cannot be re-encoded and the redirect table is the only recovery path. It stays
        null on the reserved code, where no tag exists to have a state. Corrected Thursday
        22 October 2026 as erratum E20, documentation only.
      tags: [Admin Tags]
      security:
        - bearerAuth: []
      x-tap-path: false
      x-minimum-role: Admin
      responses:
        '200':
          description: The deployed redirect table, one entry per tag code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRecordList'
              examples:
                deployedTable:
                  summary: The four encoded codes and the reserved fifth
                  value:
                    deployedAt: '2026-08-16T18:30:00Z'
                    sourceCommit: 13cce96
                    data:
                      - code: ps
                        blendSlug: persian-sunrise
                        requestPath: /t/ps
                        targetPath: /blend.html?blend=persian-sunrise&via=nfc
                        redirectStatus: 307
                        unitsEncoded: 250
                        status: encoded
                        encodedOn: '2026-07-24'
                        supplierOrderRef: SO4731
                        chipPartNumber: ST25TV02KC
                        writeProtected: true
                        ndefUri: https://treveanspice.com/t/ps
                        lastVerifiedAgainstPhysicalTag: null
                      - code: cs
                        blendSlug: caribbean-sunset
                        requestPath: /t/cs
                        targetPath: /blend.html?blend=caribbean-sunset&via=nfc
                        redirectStatus: 307
                        unitsEncoded: 250
                        status: encoded
                        encodedOn: '2026-07-24'
                        supplierOrderRef: SO4731
                        chipPartNumber: ST25TV02KC
                        writeProtected: true
                        ndefUri: https://treveanspice.com/t/cs
                        lastVerifiedAgainstPhysicalTag: null
                      - code: sr
                        blendSlug: silk-road
                        requestPath: /t/sr
                        targetPath: /blend.html?blend=silk-road&via=nfc
                        redirectStatus: 307
                        unitsEncoded: 250
                        status: encoded
                        encodedOn: '2026-07-24'
                        supplierOrderRef: SO4731
                        chipPartNumber: ST25TV02KC
                        writeProtected: true
                        ndefUri: https://treveanspice.com/t/sr
                        lastVerifiedAgainstPhysicalTag: null
                      - code: nm
                        blendSlug: north-african-night-market
                        requestPath: /t/nm
                        targetPath: /blend.html?blend=north-african-night-market&via=nfc
                        redirectStatus: 307
                        unitsEncoded: 250
                        status: encoded
                        encodedOn: '2026-07-24'
                        supplierOrderRef: SO4731
                        chipPartNumber: ST25TV02KC
                        writeProtected: true
                        ndefUri: https://treveanspice.com/t/nm
                        lastVerifiedAgainstPhysicalTag: null
                      - code: kg
                        blendSlug: kyoto-garden
                        requestPath: /t/kg
                        targetPath: /blend.html?blend=kyoto-garden&via=nfc
                        redirectStatus: 307
                        unitsEncoded: 0
                        status: reserved
                        encodedOn: null
                        supplierOrderRef: null
                        chipPartNumber: null
                        writeProtected: null
                        ndefUri: null
                        lastVerifiedAgainstPhysicalTag: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the managed identity provider on the Trevean AWS account, validated
        on signature, issuer, audience and expiry. The roles claim carries one of Admin,
        Editor or Viewer. Insufficient role returns 403, not 404.

  headers:
    CacheControlPublic:
      description: Public content is briefly cacheable and revalidates in the background.
      schema:
        type: string
        examples: ['public, max-age=60, stale-while-revalidate=300']
    ETag:
      description: Entity tag. Build callers send If-None-Match and take 304 responses.
      schema:
        type: string
        examples: ['"W/12-1755423731"']
    XRequestId:
      description: ULID, identical to error.requestId and to the structured log line.
      schema:
        type: string
        examples: ['01J9Z8XK4M2Q7T5V3N8R1B6C0D']
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        examples: [30]

  parameters:
    BlendSlug:
      name: slug
      in: path
      required: true
      description: The blend slug. One of the five real slugs.
      schema:
        $ref: '#/components/schemas/Slug'
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        pattern: '^rcp_[0-9A-HJKMNP-TV-Z]{26}$'
        examples: ['rcp_01J9Z91B2C3D4E5F6G7H8J9K0M']
    GrowerId:
      name: growerId
      in: path
      required: true
      schema:
        type: string
        pattern: '^grw_[0-9A-HJKMNP-TV-Z]{26}$'
        examples: ['grw_01J9Z900A1B2C3D4E5F6G7H8J9']
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        pattern: '^med_[0-9A-HJKMNP-TV-Z]{26}$'
        examples: ['med_01J9Z8XK4M2Q7T5V3N8R1B6C0D']
    StatusFilter:
      name: status
      in: query
      required: false
      description: |
        Filter by publication status. Unauthenticated callers may only request published,
        and any other value returns published only rather than an error.
      schema:
        $ref: '#/components/schemas/ContentStatus'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from a previous nextCursor. Cursor pagination only. Offset pagination
        is not offered, because it does not exist cheaply in DynamoDB and pretending
        otherwise produces a table scan.
      schema:
        type: string
        maxLength: 2048
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client generated key, retained 24 hours. Replaying returns the original result.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed request or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validationFailed:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: '1 field failed validation.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
                  details:
                    - field: slug
                      issue: pattern_mismatch
    Unauthenticated:
      description: Missing, malformed or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            expired:
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: 'The access token has expired. Sign in again.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
    Forbidden:
      description: |
        Valid credentials, insufficient role. Returned rather than 404: hiding the existence
        of admin routes from an authenticated internal user buys nothing and makes support
        harder.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            viewerTriedToPublish:
              value:
                error:
                  code: INSUFFICIENT_ROLE
                  message: 'Publishing requires the Editor role. Your role is Viewer.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
    NotFound:
      description: The resource does not exist, or is not published and the caller is unauthenticated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            blendNotFound:
              value:
                error:
                  code: BLEND_NOT_FOUND
                  message: "No published blend exists with slug 'persian-sunrize'."
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
                  details:
                    - field: slug
                      issue: not_found
    VersionConflict:
      description: |
        The version supplied does not match the stored version. Someone else saved first.
        Re-read, merge, and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            conflict:
              value:
                error:
                  code: VERSION_CONFLICT
                  message: 'This blend was changed by editor@treveanspice.com at 09:11. Reload before saving.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
                  details:
                    - field: version
                      issue: stale
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            limited:
              value:
                error:
                  code: RATE_LIMITED
                  message: 'Rate limit exceeded. Retry in 30 seconds.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
    UpstreamUnavailable:
      description: An upstream dependency failed. The page degrades a price label rather than breaking.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            shopifyDown:
              value:
                error:
                  code: UPSTREAM_UNAVAILABLE
                  message: 'The catalog mirror could not be refreshed from Shopify.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
    InternalError:
      description: Unhandled error. Always logged against the same requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: 'Something went wrong. Quote the requestId when reporting this.'
                  requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D

  schemas:

    Slug:
      type: string
      description: Lowercase hyphen separated identifier. The five real values are enumerated for validation.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64
      enum:
        - persian-sunrise
        - caribbean-sunset
        - north-african-night-market
        - silk-road
        - kyoto-garden
      examples: ['persian-sunrise']

    TagCode:
      type: [string, 'null']
      description: |
        The short code encoded into the NDEF URI record on the tag, as in
        treveanspice.com/t/{code}. Null on a direct visit with no tag and no QR.
      pattern: '^[a-z]{2}$'
      enum: [ps, cs, sr, nm, kg, null]
      examples: ['ps']

    ContentStatus:
      type: string
      enum: [draft, published, archived]
      description: Unknown future values must be treated by clients as draft, not thrown on.
      examples: ['published']

    LaunchTier:
      type: string
      enum: [real, seeded]
      description: |
        real means launch content is supplied by Trevean. seeded means the record exists so
        the page shape can be built and measured before content lands. Persian Sunrise and
        Caribbean Sunset are real at launch, the other three are seeded.
      examples: ['real']

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC, with a Z suffix. No local times anywhere in this API.
      examples: ['2026-08-17T09:41:07Z']

    Money:
      type: object
      description: Integer minor units plus an ISO 4217 code. Never a float.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor units. 2400 is $24.00.
          examples: [2400]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: ['USD']

    GeoPoint:
      type: object
      description: >-
        A farm location. Latitude and longitude are nullable because they are factual
        claims about a real supply chain, and Trevean supplies them. Before content
        lands, an implementation must be able to say "not known" rather than being
        forced to invent a coordinate that would render on a map as a real grower's
        farm. Widened from non nullable on Saturday 22 August 2026, erratum E12.
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          examples: [32.6539]
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          examples: [51.666]
        label:
          type: [string, 'null']
          maxLength: 200
          examples: ['Smallholding outside Isfahan, Iran']

    ErrorEnvelope:
      type: object
      description: The single error shape returned by every non 2xx response from every operation.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              description: Stable and machine readable. Clients branch on this, never on message.
              examples: ['BLEND_NOT_FOUND']
            message:
              type: string
              description: |
                For developers and admin users. Never rendered to a consumer. Wording may
                change without a version bump.
              examples: ["No published blend exists with slug 'persian-sunrize'."]
            requestId:
              type: string
              pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
              examples: ['01J9Z8XK4M2Q7T5V3N8R1B6C0D']
            details:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                    examples: ['slug']
                  issue:
                    type: string
                    examples: ['not_found']

    MediaKind:
      type: string
      enum: [hero, gallery, grower_portrait, recipe]
      examples: ['hero']

    MediaRef:
      type: [object, 'null']
      description: |
        A CDN reference with explicit dimensions. Dimensions are always present so nothing
        shifts during layout, which is a Lighthouse requirement and a real user experience
        one.
      additionalProperties: false
      required: [mediaId, cdnUrl, alt, width, height]
      properties:
        mediaId:
          type: string
          pattern: '^med_[0-9A-HJKMNP-TV-Z]{26}$'
        cdnUrl:
          type: string
          format: uri
          examples: ['https://cdn.treveanspice.com/media/med_01J9Z8XK4M2Q7T5V3N8R1B6C0D/hero-1280.avif']
        alt:
          type: string
          maxLength: 300
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        blurDataUrl:
          type: [string, 'null']
          description: Tiny inline placeholder. Inlined into the HTML, never a separate request.
        formats:
          type: array
          items:
            type: string
            enum: [avif, webp, jpeg, png]
          examples:
            - [avif, webp, jpeg]

    Media:
      type: object
      additionalProperties: false
      required: [mediaId, filename, contentType, kind, status, createdAt]
      properties:
        mediaId:
          type: string
          pattern: '^med_[0-9A-HJKMNP-TV-Z]{26}$'
        filename:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/avif]
        bytes:
          type: [integer, 'null']
          minimum: 0
        kind:
          $ref: '#/components/schemas/MediaKind'
        status:
          type: string
          enum: [pending, processing, ready, failed]
          description: |
            pending means the presigned URL was issued but the object is not confirmed.
            processing means derivatives are being generated. A hero image that is not ready
            blocks publish.
        alt:
          type: [string, 'null']
          maxLength: 300
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        cdnUrl:
          type: [string, 'null']
          format: uri
        derivatives:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [format, width, cdnUrl]
            properties:
              format:
                type: string
                enum: [avif, webp, jpeg]
              width:
                type: integer
              cdnUrl:
                type: string
                format: uri
        uploadedBy:
          type: [string, 'null']
          format: email
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    MediaList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        nextCursor:
          type: [string, 'null']

    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, contentType, bytes, kind]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/avif]
        bytes:
          type: integer
          minimum: 1
          maximum: 26214400
          description: Declared size in bytes. The presigned URL enforces this limit at S3.
        kind:
          $ref: '#/components/schemas/MediaKind'
        alt:
          type: [string, 'null']
          maxLength: 300

    MediaUploadTicket:
      type: object
      additionalProperties: false
      required: [mediaId, uploadUrl, method, headers, maxBytes, expiresAt]
      properties:
        mediaId:
          type: string
          pattern: '^med_[0-9A-HJKMNP-TV-Z]{26}$'
        uploadUrl:
          type: string
          format: uri
          description: Presigned S3 URL. The browser PUTs the file here directly.
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Headers that must be sent verbatim with the upload or the signature fails.
          additionalProperties:
            type: string
        maxBytes:
          type: integer
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    StoryBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [heading, paragraph, quote]
          description: |
            Deliberately a small closed set rather than raw HTML. Raw HTML from a CMS is how
            a blocking script or a third party font gets onto the tap path without anyone
            deciding to put it there.
        text:
          type: string
          minLength: 1
          maxLength: 2000

    Freshness:
      type: object
      description: |
        Freshness is stated per blend, not per jar. Per SKU tag encoding makes per lot
        attribution impossible, so per jar freshness is not offered rather than faked.
      additionalProperties: false
      properties:
        harvestedOn:
          type: [string, 'null']
          format: date
        blendedOn:
          type: [string, 'null']
          format: date
        bestBefore:
          type: [string, 'null']
          format: date
        lotLabel:
          type: [string, 'null']
          maxLength: 40
        note:
          type: [string, 'null']
          maxLength: 300

    ShopifyLink:
      type: object
      additionalProperties: false
      properties:
        productId:
          type: [string, 'null']
          examples: ['gid://shopify/Product/7391043289601']
        variantId:
          type: [string, 'null']
          examples: ['gid://shopify/ProductVariant/41802938471233']
        sku:
          type: [string, 'null']
          maxLength: 64
          examples: ['TRV-PS-60G']
        cartPermalinkUrl:
          type: [string, 'null']
          format: uri
          description: |
            A static cart permalink. Zero API calls, zero client credentials, zero latency,
            nothing to fail, and it bakes into the pre-rendered page. This is the one tap
            reorder mechanism.
          examples: ['https://shop.treveanspice.com/cart/41802938471233:1?channel=nfc']

    BlendSummary:
      type: object
      description: |
        Deliberately NOT additionalProperties false, because Blend extends it with allOf and
        a closed base schema would reject every field the extension adds. Unknown fields are
        rejected by request validation on the write schemas instead, where it matters.
      required: [slug, name, status, launchTier, version, updatedAt]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/ContentStatus'
        tagline:
          type: [string, 'null']
          maxLength: 200
        originCountry:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2.
        originRegion:
          type: [string, 'null']
          maxLength: 120
        launchTier:
          $ref: '#/components/schemas/LaunchTier'
        tagCode:
          $ref: '#/components/schemas/TagCode'
        heroImage:
          $ref: '#/components/schemas/MediaRef'
        recipeCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        publishedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    BlendSummaryList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BlendSummary'
        nextCursor:
          type: [string, 'null']

    Blend:
      allOf:
        - $ref: '#/components/schemas/BlendSummary'
        - type: object
          properties:
            originCity:
              type: [string, 'null']
              maxLength: 120
            farm:
              oneOf:
                - $ref: '#/components/schemas/GeoPoint'
                - type: 'null'
              description: Farm location for the map. Coarse enough not to identify a private address.
            storyBlocks:
              type: array
              maxItems: 40
              items:
                $ref: '#/components/schemas/StoryBlock'
            gallery:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MediaRef'
            freshness:
              $ref: '#/components/schemas/Freshness'
            growerId:
              type: [string, 'null']
              pattern: '^grw_[0-9A-HJKMNP-TV-Z]{26}$'
            shopify:
              $ref: '#/components/schemas/ShopifyLink'
            updatedBy:
              type: [string, 'null']
              format: email
            grower:
              description: Present only when include=grower. Snapshotted into the generated page.
              oneOf:
                - $ref: '#/components/schemas/Grower'
                - type: 'null'
            recipes:
              description: Present only when include=recipes, in carousel order.
              type: array
              items:
                $ref: '#/components/schemas/Recipe'

    BlendCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 1
          maxLength: 120
        tagline:
          type: [string, 'null']
          maxLength: 200
        launchTier:
          $ref: '#/components/schemas/LaunchTier'
        status:
          type: string
          enum: [draft]
          default: draft
          description: A blend is always created as a draft. Creating never publishes.
        originCountry:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        originRegion:
          type: [string, 'null']
          maxLength: 120
        originCity:
          type: [string, 'null']
          maxLength: 120
        farm:
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
        storyBlocks:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/StoryBlock'
        heroImageId:
          type: [string, 'null']
          pattern: '^med_[0-9A-HJKMNP-TV-Z]{26}$'
        galleryImageIds:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^med_[0-9A-HJKMNP-TV-Z]{26}$'
        freshness:
          $ref: '#/components/schemas/Freshness'
        growerId:
          type: [string, 'null']
          pattern: '^grw_[0-9A-HJKMNP-TV-Z]{26}$'
        shopify:
          $ref: '#/components/schemas/ShopifyLink'

    BlendUpdate:
      type: object
      description: |
        Partial update. An omitted field is unchanged, an explicit null clears it. slug is
        not updatable: a thousand encoded tags resolve to it through the redirect table, so
        changing a slug strands inventory.
      additionalProperties: false
      required: [version]
      properties:

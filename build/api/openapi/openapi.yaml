          type: boolean
        inventoryStatus:
          type: string
          enum: [in_stock, low_stock, out_of_stock, unknown]
          description: unknown is a legitimate answer when the mirror is stale. It is not an error.
        cartPermalinkUrl:
          type: [string, 'null']
          format: uri
        syncedAt:
          $ref: '#/components/schemas/Timestamp'
        stale:
          type: boolean
          default: false
          description: True when the last successful sync is older than the freshness threshold.

    ScanChannel:
      type: string
      enum: [nfc, qr, direct]
      description: |
        How the customer arrived. nfc and qr are both deduplicated by the same browser side
        token, so they are directly comparable to each other. direct covers a shared link.
      examples: ['nfc']

    ScanEventInput:
      type: object
      description: |
        The beacon body. Every field is an enum, a bounded string or a number in a documented
        range. No free text, no identifiers of value, no IP, no precise location. Unknown
        properties are rejected.
      additionalProperties: false
      required: [blendSlug, channel, dedupToken, occurredAt]
      properties:
        blendSlug:
          $ref: '#/components/schemas/Slug'
        tagCode:
          $ref: '#/components/schemas/TagCode'
        channel:
          $ref: '#/components/schemas/ScanChannel'
        dedupToken:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: |
            Random 128 bit value generated in the browser and kept in localStorage. Not a
            user identifier, carries no personal data, and has no server side identity
            attached. It exists because per SKU tag encoding provides no per-tag counter.
          examples: ['9f2c41a7b6e04d8fa3c5d17e8b0f6a24']
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        platform:
          type: string
          enum: [ios, android, other]
          default: other
        deviceFamily:
          type: [string, 'null']
          maxLength: 40
          description: Coarse family only, for example iPhone, Pixel, Galaxy. Never a full user agent.
          examples: ['iPhone']
        connectionType:
          type: string
          enum: ['slow-2g', '2g', '3g', '4g', '5g', wifi, unknown]
          default: unknown
        cacheStatus:
          type: string
          enum: [hit, miss, stale, unknown]
          default: unknown
          description: |
            From the CDN response header, read client side. A falling hit ratio is the
            earliest warning that something broke the rendering strategy.
        ttfbMs:
          type: [integer, 'null']
          minimum: 0
          maximum: 120000
        timeToReadableMs:
          type: [integer, 'null']
          minimum: 0
          maximum: 120000
          description: |
            Navigation start to page readable. The 2.0 second acceptance number, measured by
            the same instrument that records the bench runs and the September matrix.
        pageVersion:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
          description: |
            The blend version baked into the served page. Identifies stale cached HTML.

            The upper bound is derived from how the value is produced rather than chosen for
            comfort. A blend version starts at 1 and is incremented by exactly one per
            accepted admin write, so it grows no faster than admin writes are permitted, and
            section 9 of the frozen API contract caps those at 300 per minute per subject. A
            single blend absorbing that entire limit without pause for ten years reaches
            1576800000, so 2147483647 sits above anything this system can legitimately
            produce. It is also the largest signed 32 bit integer, which keeps every accepted
            value representable without loss everywhere between the browser and the stored
            attribute. The highest version in the worked examples is 12.

            The bound exists because this is an unauthenticated write on the tap path.
            Without it, minimum 1 alone accepts 1e308, which is an integer as far as JSON
            Schema is concerned, and the stored attribute cannot carry it.
        redirected:
          type: [boolean, 'null']
          description: |
            Whether the 307 from /t/{code} was in this navigation. Recorded because the
            2.0 second clock starts at the request for /t/{code}, so the hop is inside the
            budget and its cost has to be visible.

    ScanRollupPoint:
      type: object
      description: One pre-aggregated bucket. Never computed from raw events at read time.
      additionalProperties: false
      required: [bucket, scans]
      properties:
        bucket:
          type: string
          description: YYYY-MM-DD at day granularity, YYYY-MM-DDTHH at hour granularity, always UTC.
          examples: ['2026-08-17']
        scans:
          type: integer
          minimum: 0
          description: Deduplicated scans in this bucket.
        byChannel:
          type: object
          additionalProperties: false
          properties:
            nfc: { type: integer, minimum: 0 }
            qr: { type: integer, minimum: 0 }
            direct: { type: integer, minimum: 0 }
        byPlatform:
          type: object
          additionalProperties: false
          properties:
            ios: { type: integer, minimum: 0 }
            android: { type: integer, minimum: 0 }
            other: { type: integer, minimum: 0 }
        reorderClicks:
          type: integer
          minimum: 0
        recipeOpens:
          type: integer
          minimum: 0
        cache:
          type: object
          additionalProperties: false
          properties:
            hit: { type: integer, minimum: 0 }
            miss: { type: integer, minimum: 0 }
            stale: { type: integer, minimum: 0 }
        timeToReadable:
          type: object
          description: |
            count and sumMs give an honest mean. p50 and p95 are read from stored histogram
            buckets, not reconstructed from a mean, because a percentile derived from a sum
            is a fiction.
          additionalProperties: false
          properties:
            count: { type: integer, minimum: 0 }
            sumMs: { type: integer, minimum: 0 }
            p50Ms: { type: [integer, 'null'], minimum: 0 }
            p95Ms: { type: [integer, 'null'], minimum: 0 }
        topCities:
          type: array
          description: |
            Country, region and city only, derived server side from CDN viewer headers. No
            IP is stored and the browser is never asked for location permission.
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [country, scans]
            properties:
              country:
                type: string
                pattern: '^[A-Z]{2}$'
              region:
                type: [string, 'null']
                maxLength: 80
              city:
                type: [string, 'null']
                maxLength: 120
              scans:
                type: integer
                minimum: 0

    ScanTimeSeries:
      type: object
      additionalProperties: false
      required: [granularity, from, to, measurementMethod, source, points]
      properties:
        blend:
          oneOf:
            - $ref: '#/components/schemas/Slug'
            - type: 'null'
          description: Null when the series covers all blends.
        granularity:
          type: string
          enum: [hour, day]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        measurementMethod:
          type: string
          enum: [browser_token]
          description: |
            The only value. NFC and QR are deduplicated identically, because per SKU
            encoding provides no per-tag counter. Stated on every response so the dashboard
            cannot accidentally imply a precision the hardware does not give.
        measurementNote:
          type: string
          description: Human readable version of the above, rendered on the dashboard.
        source:
          type: string
          enum: [rollup]
          description: The only value. This operation never reads raw events and never scans a table.
        points:
          type: array
          items:
            $ref: '#/components/schemas/ScanRollupPoint'

    PublishResult:
      type: object
      additionalProperties: false
      required: [slug, status, version, publishedAt, revalidationId, paths]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        status:
          $ref: '#/components/schemas/ContentStatus'
        version:
          type: integer
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        revalidationId:
          type: string
          pattern: '^rvl_[0-9A-HJKMNP-TV-Z]{26}$'
        paths:
          type: array
          description: |
            Exactly the paths queued for regeneration. The previous version keeps serving
            until each one is ready.
          items:
            type: string

    RevalidateRequest:
      type: object
      additionalProperties: false
      properties:
        blendSlugs:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/Slug'
        paths:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
        reason:
          type: [string, 'null']
          maxLength: 300
          description: Recorded in the audit log. Required in practice by review, not by schema.
      anyOf:
        - required: [blendSlugs]
        - required: [paths]

    RevalidateResult:
      type: object
      additionalProperties: false
      required: [revalidationId, paths, status]
      properties:
        revalidationId:
          type: string
          pattern: '^rvl_[0-9A-HJKMNP-TV-Z]{26}$'
        paths:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [queued]

    TagRecord:
      type: object
      description: |
        One row of the redirect table as deployed. The version controlled file in the
        application repository is the source of truth. This is a read of what is live.
      additionalProperties: false
      required: [code, blendSlug, requestPath, targetPath, redirectStatus, status]
      properties:
        code:
          type: string
          pattern: '^[a-z]{2}$'
          examples: ['ps']
        blendSlug:
          $ref: '#/components/schemas/Slug'
        requestPath:
          type: string
          description: The path encoded into the NDEF URI record on the physical tag.
          examples: ['/t/ps']
        targetPath:
          type: string
          description: The 307 target.
          examples: ['/blend.html?blend=persian-sunrise&via=nfc']
        redirectStatus:
          type: integer
          enum: [307]
          description: |
            307 preserves the method and is explicitly temporary, so destinations can change
            by editing this table without a cached permanent redirect stranding inventory.
        unitsEncoded:
          type: integer
          minimum: 0
          examples: [250]
        status:
          type: string
          enum: [encoded, reserved]
          description: |
            encoded means physical tags carry this code. reserved means the code is allocated
            and served but no tag in this production run carries it.
        encodedOn:
          type: [string, 'null']
          format: date
          examples: ['2026-07-24']
        supplierOrderRef:
          type: [string, 'null']
          examples: ['SO4731']
        chipPartNumber:
          type: [string, 'null']
          description: |
            STMicroelectronics ST25TV02KC, NFC Forum Type 5 / ISO 15693. Not NTAG21x and not
            Type 2. Different air interface, different memory model, area based password
            protection rather than lock bits.
          examples: ['ST25TV02KC']
        writeProtected:
          type: [boolean, 'null']
          description: |
            Null means unknown. True across the shipped SO4731 run, reversed on Friday
            11 September 2026 (decision log D45, reversing D18): those tags are write
            protected with an area password nobody at Trevean holds and cannot be
            re-encoded, so the chip tooling serves the next order rather than this
            production run. Null on the reserved code, where no tag exists to have a state.
            Corrected Thursday 22 October 2026 as erratum E20, documentation only.
        ndefUri:
          type: [string, 'null']
          format: uri
          examples: ['https://treveanspice.com/t/ps']
        lastVerifiedAgainstPhysicalTag:
          type: [string, 'null']
          format: date-time
          description: |
            When this code was last confirmed by tapping a real tag. Every code is verified
            before and after any change of production host. A host migration that leaves this
            table behind does not break a deployment, it strands inventory.

    TagRecordList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        deployedAt:
          $ref: '#/components/schemas/Timestamp'
        sourceCommit:
          type: [string, 'null']
          description: Commit of the version controlled redirect table this deployment was built from.
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagRecord'

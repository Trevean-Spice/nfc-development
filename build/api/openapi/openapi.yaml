                      mediaId: med_01J9Z8XK4M2Q7T5V3N8R1B6C0D
                      cdnUrl: https://cdn.treveanspice.com/media/med_01J9Z8XK4M2Q7T5V3N8R1B6C0D/hero-1280.avif
                      alt: A copper bowl of saffron threads and dried rose petals

  /v1/blends/{slug}:
    get:
      operationId: getBlendBySlug
      summary: Get one blend by slug
      description: |
        Access pattern 1 in the Architecture document data layer table: blend by slug with
        grower and recipes. BUILD AND REVALIDATE ONLY, NEVER ON A TAP.

        With include=grower,recipes this returns the entire payload the blend page needs in
        one call, which is exactly what the build process asks for. The grower record is
        snapshotted into the generated page, so a later grower edit requires a republish of
        the affected blends. That is intentional: the page must not depend on a live read.
      tags: [Content]
      security:
        - {}
      x-tap-path: false
      x-called-at: build, revalidate
      parameters:
        - $ref: '#/components/parameters/BlendSlug'
        - name: include
          in: query
          required: false
          description: |
            Comma separated related resources to embed. Any other value is ignored rather
            than rejected, so adding a new includable resource later stays additive.
          schema:
            type: string
            pattern: '^[a-z]+(,[a-z]+)*$'
            examples: ['grower,recipes']
      responses:
        '200':
          description: The blend, with optional embedded grower and recipes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blend'
              examples:
                persianSunriseFull:
                  summary: Persian Sunrise with grower and recipes embedded, the exact build time payload
                  value:
                    slug: persian-sunrise
                    name: Persian Sunrise
                    status: published
                    tagline: Saffron, cardamom, rose petals and lime from Isfahan
                    launchTier: real
                    tagCode: ps
                    originCountry: IR
                    originRegion: Isfahan
                    originCity: Isfahan
                    farm:
                      latitude: 32.6539
                      longitude: 51.666
                      label: Smallholding outside Isfahan, Iran
                    storyBlocks:
                      - type: heading
                        text: Picked before the heat
                      - type: paragraph
                        text: >-

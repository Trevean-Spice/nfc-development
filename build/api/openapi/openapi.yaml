  /v1/catalog/{slug}:
    get:
      operationId: getCatalogEntry
      summary: Shopify price and availability mirror for a blend
      description: |
        Access pattern 8 in the Architecture document data layer table: catalog mirror
        read, after paint. A single read or a cache hit.

        This is a mirror of Shopify, populated by a scheduled sync and by product update
        webhooks, so Shopify latency is never inside the 2.0 second budget and a Shopify
        incident degrades a price label rather than breaking a page.

        The same values are baked into the page at build and revalidate time. This
        operation is an OPTIONAL after paint refresh. If it is slow, fails, or the customer
        is offline, the page keeps the baked value and the reorder button still works,
        because the cart permalink is a static URL requiring no API call.
      tags: [Catalog]
      security:
        - {}
      x-tap-path: after-paint-optional
      x-called-at: build, revalidate, optional after paint refresh
      parameters:
        - $ref: '#/components/parameters/BlendSlug'
      responses:
        '200':
          description: The mirrored catalog entry.
          headers:
            Cache-Control:
              description: Cacheable at the CDN. Serving a slightly stale price beats serving nothing.
              schema:
                type: string
                examples: ['public, max-age=60, stale-while-revalidate=600']
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
              examples:
                persianSunrise:
                  summary: Persian Sunrise, in stock
                  value:
                    slug: persian-sunrise
                    sku: TRV-PS-60G
                    shopifyProductId: gid://shopify/Product/7391043289601
                    shopifyVariantId: gid://shopify/ProductVariant/41802938471233
                    price:
                      amount: 2400
                      currency: USD
                    compareAtPrice: null
                    available: true
                    inventoryStatus: in_stock
                    cartPermalinkUrl: https://shop.treveanspice.com/cart/41802938471233:1?channel=nfc
                    syncedAt: '2026-08-17T08:55:00Z'
                    stale: false
                staleMirror:
                  summary: Mirror is behind because the last sync failed. The page still renders.
                  value:
                    slug: caribbean-sunset
                    sku: TRV-CS-60G
                    shopifyProductId: gid://shopify/Product/7391043355137
                    shopifyVariantId: gid://shopify/ProductVariant/41802938536769
                    price:
                      amount: 2200
                      currency: USD
                    compareAtPrice: null
                    available: true
                    inventoryStatus: unknown
                    cartPermalinkUrl: https://shop.treveanspice.com/cart/41802938536769:1?channel=nfc
                    syncedAt: '2026-08-16T04:00:00Z'
                    stale: true
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/scan-events:
    post:
      operationId: recordScanEvent
      summary: Record a scan event. THE ONLY OPERATION ON THE TAP CRITICAL PATH.
      description: |
        Access pattern 5 in the Architecture document data layer table: write a scan event,
        every tap, after paint. One conditional write.

        DELIVERY

        Sent with navigator.sendBeacon so the browser owns delivery. It survives an
        immediate navigation away and cannot block anything. Content-Type is
        application/json. If sendBeacon is unavailable, fetch with keepalive true. Never a
        blocking XHR, never before paint, never with a retry loop.

        IDEMPOTENCY

        Deduplicated server side on (blendSlug, dedupToken, deduplication window) through a
        single conditional write with no read beforehand. A duplicate returns 202 exactly
        like a first write. The client cannot tell the difference and must not try.

        The dedupToken is a random value generated in the browser and kept in localStorage.
        It is not a user identifier and carries no personal data. It exists because per SKU
        tag encoding means there is no per-tag counter, so NFC deduplication uses the same
        mechanism as QR. Reported counts are labelled with that method.

        WHAT MUST NOT BE SENT

        No IP address, no precise geolocation, no customer identifier, no email, no order
        number, no free text. Geography is derived server side from CDN viewer headers to
        country, region and city only. Unknown properties are rejected.
      tags: [Tap]
      security:
        - {}
      x-tap-path: true
      x-called-at: every tap and every QR scan, after paint, non blocking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanEventInput'
            examples:
              nfcTap:
                summary: An NFC tap on a Persian Sunrise jar, iPhone, cache hit
                value:
                  blendSlug: persian-sunrise
                  tagCode: ps
                  channel: nfc
                  dedupToken: 9f2c41a7b6e04d8fa3c5d17e8b0f6a24
                  occurredAt: '2026-08-17T09:41:07Z'
                  platform: ios
                  deviceFamily: iPhone
                  connectionType: 4g
                  cacheStatus: hit
                  ttfbMs: 184
                  timeToReadableMs: 1120
                  pageVersion: 12
                  redirected: true
              qrScan:
                summary: A QR scan on Caribbean Sunset, Android, the sole recovery route when a handset is asleep or locked
                value:
                  blendSlug: caribbean-sunset
                  tagCode: cs
                  channel: qr
                  dedupToken: 41d8b0937ca24e0f9b6e2af1c8305d77
                  occurredAt: '2026-08-17T09:44:22Z'
                  platform: android
                  deviceFamily: Pixel
                  connectionType: 4g
                  cacheStatus: hit
                  ttfbMs: 205
                  timeToReadableMs: 1290
                  pageVersion: 9
                  redirected: true
              directVisit:
                summary: A direct visit with no tag and no QR, for example a link shared by a customer
                value:
                  blendSlug: silk-road
                  tagCode: null
                  channel: direct
                  dedupToken: 6ba2f0e51c9b4d3e8a7c5019d4f38b26
                  occurredAt: '2026-08-17T10:02:00Z'
                  platform: other
                  deviceFamily: unknown
                  connectionType: wifi
                  cacheStatus: miss
                  ttfbMs: 340
                  timeToReadableMs: 1480
                  pageVersion: 2
                  redirected: false
      responses:
        '202':
          description: |
            Accepted. Returned for a new event and for a duplicate alike. Empty body.
            The client does not inspect this response and does not retry on any status.
          headers:
            Cache-Control:
              description: Never cached.
              schema:
                type: string
                examples: ['no-store']
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          description: |
            Malformed or rejected body. The client does NOT retry. A beacon that retries is
            a beacon that can interfere with navigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknownBlend:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 'blendSlug must be one of the known blend slugs.'
                      requestId: 01J9Z8XK4M2Q7T5V3N8R1B6C0D
                      details:
                        - field: blendSlug
                          issue: not_in_enum
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':

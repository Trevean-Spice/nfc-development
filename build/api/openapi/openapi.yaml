        blend, at page build time. Between 5 and 10 recipes per blend per the Scope
        document. Sorted by sortOrder ascending, then by recipeId for stability.
      tags: [Content]
      security:
        - {}
      x-tap-path: false
      x-called-at: build, revalidate
      parameters:
        - $ref: '#/components/parameters/BlendSlug'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:

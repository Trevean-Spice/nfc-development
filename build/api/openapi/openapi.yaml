                    data:
                      - slug: persian-sunrise
                        name: Persian Sunrise
                        status: published
                        tagline: Saffron, cardamom, rose petals and lime from Isfahan
                        originCountry: IR
                        originRegion: Isfahan
                        launchTier: real

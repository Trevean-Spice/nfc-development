openapi: 3.1.0

info:
  title: Trevean Spice Tap-to-Story API
  version: 1.0.0
  summary: Content, scan telemetry, catalog mirror and admin API for the Trevean Spice NFC tap-to-story MVP.
  description: |
    Frozen M1 API contract, 18 August 2026. Both engineers build against this for the
    remainder of the engagement. The prose companion to this document explains the
    reasoning; where the two disagree, this document governs the wire format.

    THE ONE RULE THAT MATTERS

    Exactly one operation is on the tap critical path: POST /v1/scan-events, and it fires
    after the page is readable, as a browser beacon. Every content operation (blends,
    recipes, growers) is called at BUILD time and REVALIDATE time only, by the build
    process and the publish pipeline. They are never called when a customer taps a jar.

    The blend page is pre-rendered and served from the CDN edge cache. On a tap the
    sequence is: 307 at the edge, cached HTML from the edge, paint, then a beacon. A page
    that fetches content on load adds a DNS lookup, a TLS handshake, a possible cold start
    and a database read to a 2.0 second budget that has roughly 400 ms of headroom on
    cellular. Every operation below carries an x-tap-path extension recording which side
    of that line it sits on.

    ATTRIBUTION

    Attribution is per SKU. The 1,000 shipped tags were encoded per blend with an
    identical URL for every jar of that blend, so there is no per-tag identifier and no
    chip UID available to the page. Scan deduplication uses a browser generated token,
    the same mechanism the QR path uses. Counts are labelled with that method rather than
    implying a precision the encoding does not provide.

    PRIVACY

    No IP address is stored. Geography is derived server side from CDN viewer headers to
    country, region and city only. The browser is never asked for location permission.
    There are no customer accounts, no cookies and no third-party trackers on the tap path.

    EXAMPLES

    Blend, slug and tag code examples are the five real blends and the real tag code map.
    Grower names, recipe content, prices and photography references in the examples are
    illustrative placeholders pending content delivery for the two launch blends.
  contact:
    name: Serene Labs Inc, Jacob Ralph
    email: jacob@serenelabs.io
  license:
    name: Work for hire, owned by Trevean Spice on full payment
    identifier: LicenseRef-Trevean-Work-For-Hire

servers:
  - url: https://api.treveanspice.com
    description: Production
  - url: https://api.staging.treveanspice.com
    description: Staging. Everything on the contractor side builds and measures here so the schedule never waits on client DNS.
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Content
    description: |
      Public reads. Called at build and revalidate time only. NOT on the tap path.
      Only published content is served without a credential.
  - name: Tap
    description: |
      The only operation on the tap critical path. Fires after paint, as a browser beacon,
      and must never block or retry.
  - name: Catalog
    description: |
      Shopify price and availability mirror. Baked into the page at build time and
      optionally refreshed after paint. Degradable: if it fails, the page keeps the baked
      value and the reorder permalink still works.
  - name: Admin Content
    description: Role protected content authoring. Not on the tap path.
  - name: Admin Media
    description: |
      Presigned S3 upload plus asynchronous derivative generation. A large photograph
      never passes through an application function.
  - name: Admin Publishing
    description: Publish and on demand revalidation of pre-rendered pages.
  - name: Admin Analytics
    description: |
      Dashboard time series read from pre-aggregated rollups. Never a raw event query and
      never a table scan.
  - name: Admin Tags
    description: |
      Read only view of the deployed redirect table and tag records. The redirect table is
      a version controlled artifact deployed with the application and is not editable
      through this API by any role.

security:
  - {}

paths:

  /v1/blends:
    get:
      operationId: listBlends
      summary: List blends
      description: |
        Access pattern 2 in the Architecture document data layer table: list blends by
        status. Used by the build manifest, the sitemap generator and the admin list view.
        Unauthenticated callers receive published blends only.
      tags: [Content]
      security:
        - {}
      x-tap-path: false
      x-called-at: build, revalidate, admin page load
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of blend summaries, in launch order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlendSummaryList'
              examples:
                allPublished:
                  summary: |
                    The four published blends, which are the four codes currently encoded.
                    Kyoto Garden is draft and is never returned by this operation, because
                    this operation has no authenticated variant and only published content is
                    served without a credential. It appears through the admin list operation
                    instead. The reserved fifth code is visible on the tag records operation.

name: API contract tests

# What this gates
#
# SOW Rev C section 5 makes "API contract tests pass" an explicit M2 acceptance criterion.
# The API contract was frozen on 18 August 2026 so that two engineers could build against it
# for seven weeks without talking to each other. A frozen contract with no executable
# enforcement is a document, not a contract. This workflow is what makes the freeze real.
#
# Three jobs, three different questions:
#
#   contract-tests-stub  Is the contract self consistent and implementable? Runs on every
#                        push and pull request, needs no network and no credentials.
#   contract-tests-staging  Does the staging implementation obey it? Runs on a schedule and
#                           on demand, needs credentials.
#   contract-tests-production  Does production still obey it? Read only, writes disabled.
#
# To adopt this into the client nfc-development repository, see the README beside this
# suite, section "Adopting this into nfc-development".
#
# The two live jobs run only when the repository variable CONTRACT_TESTS_LIVE is 'true'
# and the three CONTRACT_TEST_TOKEN_* secrets are set. Without them they are skipped,
# not failed. The stub job needs nothing and also runs in ci.yml.

on:
  # pull_request and workflow_dispatch only: the shared Actions minutes run out on push and
  # daily schedules (2026-10-14). Run the drift check by hand with workflow_dispatch.
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Which target to run against
        required: true
        default: stub
        type: choice
        options: [stub, staging, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: build/contract-tests

env:
  NODE_VERSION: '20'

jobs:
  contract-tests-stub:
    name: Contract tests against the stub
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'stub'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: build/contract-tests/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs the whole suite against an in memory implementation of the frozen contract.
      # This job answers a question no implementation can answer: is the specification
      # itself consistent, and are its worked examples valid against its own schemas.
      - name: Run the suite against the stub
        run: npm run test:stub

  contract-tests-staging:
    name: Contract tests against staging
    runs-on: ubuntu-latest
    # Needs the three CONTRACT_TEST_TOKEN_* secrets and a staging stack. Skipped unless the
    # repository variable CONTRACT_TESTS_LIVE is 'true', which is set only once the secrets
    # are, so a repository without them never shows this job red.
    if: vars.CONTRACT_TESTS_LIVE == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: build/contract-tests/package-lock.json

      - name: Install
        run: npm ci

      - name: Run the suite against staging
        env:
          CONTRACT_TEST_BASE_URL: https://api.staging.treveanspice.com
          CONTRACT_TEST_PAGE_ORIGIN: https://staging.treveanspice.com
          CONTRACT_TEST_TOKEN_ADMIN: ${{ secrets.CONTRACT_TEST_TOKEN_ADMIN }}
          CONTRACT_TEST_TOKEN_EDITOR: ${{ secrets.CONTRACT_TEST_TOKEN_EDITOR }}
          CONTRACT_TEST_TOKEN_VIEWER: ${{ secrets.CONTRACT_TEST_TOKEN_VIEWER }}
          CONTRACT_TEST_ALLOW_WRITES: 'true'
          # Measured from a GitHub runner, so client network time is inside the number.
          # Reported rather than gated here; the gated measurement is taken in region.
          CONTRACT_TEST_LATENCY_ENFORCE: 'false'
        run: npm test

  contract-tests-production:
    name: Contract tests against production, read only
    runs-on: ubuntu-latest
    # Same gate as staging: the three tokens, and CONTRACT_TESTS_LIVE set to 'true'.
    if: vars.CONTRACT_TESTS_LIVE == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: build/contract-tests/package-lock.json

      - name: Install
        run: npm ci

      # CONTRACT_TEST_ALLOW_WRITES is false, so nothing is created, updated, published or
      # archived. The tests that assert an anonymous caller is refused still run, because a
      # request that is correctly refused changes nothing, and that is the check worth having
      # against production more than anywhere else.
      - name: Run the suite against production
        env:
          CONTRACT_TEST_BASE_URL: https://api.treveanspice.com
          CONTRACT_TEST_PAGE_ORIGIN: https://treveanspice.com
          CONTRACT_TEST_TOKEN_ADMIN: ${{ secrets.CONTRACT_TEST_TOKEN_ADMIN }}
          CONTRACT_TEST_TOKEN_EDITOR: ${{ secrets.CONTRACT_TEST_TOKEN_EDITOR }}
          CONTRACT_TEST_TOKEN_VIEWER: ${{ secrets.CONTRACT_TEST_TOKEN_VIEWER }}
          CONTRACT_TEST_ALLOW_WRITES: 'false'
          CONTRACT_TEST_LATENCY_ENFORCE: 'false'
        run: npm test
